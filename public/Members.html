<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會員逐筆讀取</title>
<style>body{font:16px system-ui;max-width:820px;margin:50px auto;padding:20px;background:#f3f6fa;color:#172b45}main{background:white;padding:28px;border-radius:16px}input{box-sizing:border-box;width:100%;padding:12px}button{padding:12px;margin:12px 8px 12px 0;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:12px}#status{min-height:30px;color:#245f87}</style></head>
<body><main><h1>會員資料 · 逐筆讀取</h1><p>每次取得一筆，收到回覆後才發出下一次請求。畫面最多保留 200 筆。</p>
<label>存取 Token<input id="token" type="password" autocomplete="off" placeholder="貼上由伺服器簽發的 Token"></label>
<button id="connect">連線</button><button id="next" disabled>讀取下一筆</button><button id="auto" disabled>自動逐筆讀取</button><button id="reset">重新開始</button>
<div id="status" role="status">尚未連線</div><table><thead><tr><th>會員 ID</th><th>會員名稱</th></tr></thead><tbody id="rows"></tbody></table></main>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);let socket,after='0',busy=false,automatic=false,done=false,timer,generation=0;
function status(t){$('status').textContent=t;}function controls(){const ready=socket?.connected&&!busy&&!done;$('next').disabled=!ready;$('auto').disabled=!ready;$('auto').textContent=automatic?'停止自動讀取':'自動逐筆讀取';}
function stop(){automatic=false;clearTimeout(timer);controls();}
$('connect').onclick=()=>{stop();generation++;socket?.disconnect();after='0';done=false;busy=false;$('rows').replaceChildren();socket=io({transports:['websocket'],auth:{token:$('token').value},reconnectionDelay:1000,reconnectionDelayMax:10000,randomizationFactor:0.5});socket.on('connect',()=>{status('已連線');controls();});socket.on('disconnect',()=>{stop();status('已斷線，重新連線後可從目前游標繼續');controls();});socket.on('connect_error',e=>status(e.message));};
async function next(){if(!socket?.connected||busy||done)return;busy=true;controls();const g=generation;try{const r=await socket.timeout(5000).emitWithAck('member:next',{after});if(g!==generation)return;if(!r.ok)throw Error(r.code);if(r.member){const tr=document.createElement('tr');for(const v of [r.member.id,r.member.displayName]){const td=document.createElement('td');td.textContent=v;tr.append(td);}$('rows').append(tr);if($('rows').children.length>200)$('rows').firstChild.remove();}after=r.nextCursor;done=r.done;status(done?'目前已讀完全部會員':'最後讀取 ID：'+after);if(done)stop();}catch(e){if(g===generation){stop();status('讀取失敗：'+e.message+'；可重試，游標未前進。');}}finally{if(g===generation){busy=false;controls();if(automatic)timer=setTimeout(next,1000);}}}
$('next').onclick=next;$('auto').onclick=()=>{automatic=!automatic;clearTimeout(timer);controls();if(automatic)next();};$('reset').onclick=()=>{stop();generation++;busy=false;after='0';done=false;$('rows').replaceChildren();status('游標已重設');controls();};
</script></body></html>
